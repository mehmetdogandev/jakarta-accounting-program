<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <div class="admin-sidebar-inner d-flex flex-column min-vh-100">
        <header class="admin-sb-header">
            <h:link outcome="/admin/dashboard.xhtml" styleClass="admin-sb-brand admin-sb-brand-grow">
                <span class="admin-sb-badge">JM</span>
                <div class="min-w-0">
                    <div class="admin-sb-title">Jakarta Muhasebe</div>
                    <div class="admin-sb-sub">Yönetim paneli</div>
                </div>
            </h:link>
            <button type="button"
                    class="btn btn-outline-secondary btn-sm d-none d-lg-flex align-items-center justify-content-center p-2 admin-sidebar-toggle-collapse flex-shrink-0"
                    data-admin-sidebar-action="collapse"
                    aria-controls="adminSidebar"
                    aria-expanded="true"
                    title="Kenar çubuğunu gizle"
                    aria-label="Kenar çubuğunu gizle">
                <svg class="admin-icon-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     aria-hidden="true">
                    <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M9 4v16M9 4h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9"/>
                </svg>
            </button>
        </header>

        <nav class="admin-sb-content flex-grow-1 overflow-y-auto">
            <details class="admin-sb-details" open="open">
                <summary class="admin-sb-details-summary">Sistem yönetimi</summary>
                <div class="admin-sb-details-body">
                    <h:link outcome="/admin/dashboard.xhtml"
                            styleClass="#{view.viewId == '/admin/dashboard.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}">
                        Ana sayfa
                    </h:link>
                    <h:link outcome="/admin/users.xhtml"
                            styleClass="#{view.viewId == '/admin/users.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('USER','ACCESS')}">
                        Kullanıcılar
                    </h:link>
                    <h:link outcome="/admin/roles.xhtml"
                            styleClass="#{view.viewId == '/admin/roles.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('ROLE','ACCESS')}">
                        Roller
                    </h:link>
                    <h:link outcome="/admin/role-groups.xhtml"
                            styleClass="#{view.viewId == '/admin/role-groups.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('ROLE_GROUP','ACCESS')}">
                        Rol grupları
                    </h:link>
                </div>
            </details>
            <details class="admin-sb-details">
                <summary class="admin-sb-details-summary">Muhasebe işlemleri</summary>
                <div class="admin-sb-details-body">
                    <h:link outcome="/admin/current-accounts"
                            styleClass="#{view.viewId == '/admin/current-accounts.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('CURRENT_ACCOUNT','ACCESS')}">
                        Cari hesaplar
                    </h:link>
                    <h:link outcome="/admin/journal-entries"
                            styleClass="#{view.viewId == '/admin/journal-entries.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('JOURNAL_ENTRY','ACCESS')}">
                        Muhasebe fişleri
                    </h:link>
                    <h:link outcome="/admin/cash-accounts"
                            styleClass="#{view.viewId == '/admin/cash-accounts.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('CASH_ACCOUNT','ACCESS')}">
                        Kasalar
                    </h:link>
                    <h:link outcome="/admin/bank-accounts"
                            styleClass="#{view.viewId == '/admin/bank-accounts.xhtml' ? 'admin-nav-link active' : 'admin-nav-link'}"
                            rendered="#{rbac.can('BANK_ACCOUNT','ACCESS')}">
                        Banka hesapları
                    </h:link>
                </div>
            </details>
        </nav>

        <footer class="admin-sb-footer border-top"
                style="border-color: var(--sidebar-border) !important;">
            <div class="admin-sb-user">
                <strong>Oturum</strong>
                <h:outputText value="#{empty sessionScope.user ? '—' : sessionScope.user.email}"/>
            </div>
            <h:form id="adminLogoutForm">
                <h:commandButton id="logoutBtn"
                                 type="submit"
                                 styleClass="admin-btn-logout"
                                 value="Çıkış yap"
                                 action="#{authBean.logout()}"/>
            </h:form>
        </footer>
    </div>
</ui:composition>
