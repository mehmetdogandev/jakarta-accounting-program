<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Yönetim</ui:define>

    <ui:define name="content">
        <div class="admin-page-card mb-3">
            <h1 class="admin-page-title">Yönetim paneli</h1>
            <p class="admin-page-lead mb-0">Sol menüden modüllere erişin. Menü öğeleri ACCESS yetkisine göre görünür.</p>
        </div>

        <div class="admin-dashboard-grid">
            <h:link outcome="/admin/users" styleClass="admin-dash-card" rendered="#{rbac.can('USER','ACCESS')}">
                Kullanıcılar
            </h:link>
            <h:link outcome="/admin/roles" styleClass="admin-dash-card" rendered="#{rbac.can('ROLE','ACCESS')}">
                Roller
            </h:link>
            <h:link outcome="/admin/role-groups" styleClass="admin-dash-card"
                    rendered="#{rbac.can('ROLE_GROUP','ACCESS')}">
                Rol grupları
            </h:link>
        </div>
    </ui:define>
</ui:composition>
