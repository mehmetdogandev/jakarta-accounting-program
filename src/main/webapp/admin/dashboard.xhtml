<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Yönetim</ui:define>

    <ui:define name="content">
        <h1 class="h3 mb-3">Yönetim paneli</h1>
        <p class="text-muted">Sol menüden modüllere erişin. Menü öğeleri ACCESS yetkisine göre görünür.</p>
        <div class="d-flex flex-wrap gap-2">
            <h:link outcome="/admin/users" styleClass="btn btn-primary" rendered="#{rbac.can('USER','ACCESS')}">
                Kullanıcılar
            </h:link>
            <h:link outcome="/admin/roles" styleClass="btn btn-primary" rendered="#{rbac.can('ROLE','ACCESS')}">
                Roller
            </h:link>
            <h:link outcome="/admin/role-groups" styleClass="btn btn-primary"
                    rendered="#{rbac.can('ROLE_GROUP','ACCESS')}">
                Rol grupları
            </h:link>
        </div>
    </ui:define>
</ui:composition>
