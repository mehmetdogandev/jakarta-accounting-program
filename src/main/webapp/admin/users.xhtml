<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Kullanıcılar</ui:define>

    <ui:define name="content">
        <h:form id="mainForm">
            <p:messages id="msgs" showDetail="true" closable="true"/>

            <div class="admin-page-card">
                <h1 class="admin-page-title">Sistem kullanıcıları</h1>
                <p class="admin-page-lead">Kayıtlı kullanıcıları arayın; yetkiniz varsa yeni kullanıcı oluşturabilir veya mevcut kayıtları düzenleyebilirsiniz.</p>

                <div class="admin-toolbar">
                    <div class="admin-toolbar-grow admin-search-wrap">
                        <span class="admin-search-icon pi pi-search" aria-hidden="true"/>
                        <p:inputText id="userSearchInp" value="#{adminUsersBean.userSearch}"
                                     placeholder="E-posta veya ad soyad ara…"
                                     styleClass="w-100">
                            <p:ajax event="keyup" delay="300" update="usersTablePanel"/>
                        </p:inputText>
                    </div>
                    <p:commandButton value="Yeni kullanıcı" icon="pi pi-plus" styleClass="admin-btn-primary"
                                     actionListener="#{adminUsersBean.openNew}"
                                     update="mainForm"
                                     rendered="#{rbac.can('USER','CREATE')}"
                                     oncomplete="PF('userDlg').show()"/>
                </div>

                <p:outputPanel id="usersTablePanel" layout="block">
                    <p:dataTable id="usersTbl" value="#{adminUsersBean.filteredUsers}" var="u"
                                 paginator="true" rows="10" emptyMessage="Kayıt yok"
                                 styleClass="admin-table">
                        <f:facet name="header">
                            <div class="d-flex justify-content-end pb-1">
                                <p:commandButton id="colToggleBtn" type="button" value="Sütunlar" icon="pi pi-table"
                                                 styleClass="admin-btn-outline"/>
                                <p:columnToggler datasource="usersTbl" trigger="colToggleBtn"/>
                            </div>
                        </f:facet>
                        <p:column headerText="Kullanıcı" togglable="false">
                            <div class="d-flex align-items-center gap-2">
                                <span class="admin-avatar"><h:outputText value="#{adminUi.initials(u)}"/></span>
                                <div>
                                    <div class="admin-user-cell-name">
                                        <h:outputText value="#{u.name} #{u.surname}"/>
                                    </div>
                                    <div class="admin-user-cell-sub">
                                        <h:outputText value="#{u.email}"/>
                                    </div>
                                </div>
                            </div>
                        </p:column>
                        <p:column headerText="E-posta" togglable="true">
                            <h:outputText value="#{u.email}"/>
                        </p:column>
                        <p:column headerText="Kayıt tarihi" togglable="true">
                            <h:outputText value="#{adminUi.formatShortDate(u.createdAt)}"/>
                        </p:column>
                        <p:column headerText="İşlemler" style="width:120px" togglable="false">
                            <p:commandButton icon="pi pi-pencil" title="Düzenle"
                                             styleClass="admin-btn-icon"
                                             actionListener="#{adminUsersBean.openEdit(u)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('USER','UPDATE')}"
                                             oncomplete="PF('userDlg').show()"/>
                            <p:commandButton icon="pi pi-trash" title="Sil"
                                             styleClass="admin-btn-icon admin-btn-danger-icon ms-1"
                                             actionListener="#{adminUsersBean.softDelete(u)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('USER','DELETE')}">
                                <p:confirm header="Onay" message="Kullanıcı soft-delete ile kaldırılsın mı?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </p:outputPanel>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"/>

            <p:dialog id="userDlg" header="Kullanıcı" widgetVar="userDlg" modal="true" appendTo="@body"
                      dynamic="true" width="480" styleClass="admin-dialog">
                <h:panelGroup rendered="#{adminUsersBean.editUser != null}">
                    <div class="mb-2">
                        <label class="form-label">E-posta</label>
                        <p:inputText value="#{adminUsersBean.editUser.email}" styleClass="form-control w-100"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Şifre</label>
                        <p:password value="#{adminUsersBean.editUser.password}" styleClass="form-control w-100" redisplay="true"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Ad</label>
                        <p:inputText value="#{adminUsersBean.editUser.name}" styleClass="form-control w-100"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Soyad</label>
                        <p:inputText value="#{adminUsersBean.editUser.surname}" styleClass="form-control w-100"/>
                    </div>
                    <p:commandButton value="Kaydet" icon="pi pi-check" action="#{adminUsersBean.save}"
                                     update="mainForm" process="@form"/>
                    <p:commandButton value="İptal" icon="pi pi-times" type="button" styleClass="ui-button-secondary ms-2"
                                     onclick="PF('userDlg').hide()"/>
                </h:panelGroup>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
