<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Rol grupları</ui:define>

    <ui:define name="topbar">
        <span class="admin-app-topbar-heading">Rol grupları</span>
    </ui:define>

    <ui:define name="content">
        <h:form id="mainForm">
            <p:messages id="msgs" showDetail="true" closable="true"/>

            <div class="admin-page-card">
                <h1 class="admin-page-title">Rol grupları</h1>
                <p class="admin-page-lead">Grupları başlık veya açıklamaya göre arayın; bağlı roller rozet olarak özetlenir.</p>

                <div class="admin-list-panel">
                    <div class="admin-toolbar">
                        <div class="admin-toolbar-grow admin-search-wrap">
                            <span class="admin-search-icon pi pi-search" aria-hidden="true"/>
                            <p:inputText value="#{adminRoleGroupsBean.groupSearch}"
                                         placeholder="Başlık veya açıklama ara…"
                                         styleClass="w-100">
                                <p:ajax event="keyup" delay="300" update="rgTablePanel"/>
                            </p:inputText>
                        </div>
                        <div class="admin-toolbar-actions">
                            <p:commandButton value="Yeni rol grubu" icon="pi pi-plus" styleClass="admin-btn-primary"
                                             actionListener="#{adminRoleGroupsBean.openNew}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','CREATE')}"
                                             oncomplete="PF('rgDlg').show()"/>
                            <p:commandButton id="rgColToggleBtn" type="button" value="Sütunlar" icon="pi pi-table"
                                             styleClass="admin-btn-outline"/>
                            <p:columnToggler datasource="rgTbl" trigger="rgColToggleBtn"/>
                        </div>
                    </div>

                    <p:outputPanel id="rgTablePanel" layout="block">
                    <p:dataTable id="rgTbl" value="#{adminRoleGroupsBean.filteredGroups}" var="g"
                                 paginator="true" paginatorPosition="bottom" rows="10" emptyMessage="Kayıt yok"
                                 styleClass="admin-table">
                        <p:column headerText="Grup" togglable="true">
                            <div class="admin-rg-title">
                                <h:outputText value="#{g.title}"/>
                            </div>
                            <div class="admin-rg-desc">
                                <h:outputText value="#{g.description}"/>
                            </div>
                        </p:column>
                        <p:column headerText="Roller" togglable="true">
                            <ui:repeat value="#{adminRoleGroupsBean.linkedRolesTopThree(g)}" var="rn">
                                <span class="admin-badge"><h:outputText value="#{rn}"/></span>
                            </ui:repeat>
                            <h:outputText value="+#{adminRoleGroupsBean.linkedRolesExtraCount(g)} daha"
                                          rendered="#{adminRoleGroupsBean.linkedRolesExtraCount(g) gt 0}"
                                          styleClass="admin-more-badge"/>
                            <h:panelGroup rendered="#{adminRoleGroupsBean.linkedRolesExtraCount(g) eq 0 and empty adminRoleGroupsBean.linkedRolesTopThree(g)}">
                                <span class="text-muted small">—</span>
                            </h:panelGroup>
                        </p:column>
                        <p:column headerText="Oluşturulma" style="width:11rem" togglable="true">
                            <h:outputText value="#{adminUi.formatShortDate(g.createdAt)}"/>
                        </p:column>
                        <p:column headerText="İşlemler" style="width:9rem" togglable="false">
                            <p:commandButton icon="pi pi-eye" title="Detay"
                                             styleClass="admin-btn-icon"
                                             actionListener="#{adminRoleGroupsBean.openDetail(g)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','READ')}"
                                             oncomplete="PF('rgDetailDlg').show()"/>
                            <p:commandButton icon="pi pi-pencil" title="Düzenle"
                                             styleClass="admin-btn-icon ms-1"
                                             actionListener="#{adminRoleGroupsBean.openEdit(g)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','UPDATE')}"
                                             oncomplete="PF('rgDlg').show()"/>
                            <p:commandButton icon="pi pi-trash" title="Sil"
                                             styleClass="admin-btn-icon admin-btn-danger-icon ms-1"
                                             actionListener="#{adminRoleGroupsBean.softDelete(g)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','DELETE')}">
                                <p:confirm header="Onay" message="Grup soft-delete ile kaldırılsın mı?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                    </p:outputPanel>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"/>

            <p:dialog id="rgDetailDlg" header="Rol grubu özeti" widgetVar="rgDetailDlg" modal="true" appendTo="@body"
                      dynamic="true" styleClass="admin-dialog admin-dialog-detail"
                      style="max-width: min(92vw, 520px); width: 100%;">
                <h:panelGroup rendered="#{adminRoleGroupsBean.detailGroup != null}">
                    <div class="admin-dialog-hero">
                        <h2 class="admin-dialog-hero-title">
                            <h:outputText value="#{adminRoleGroupsBean.detailGroup.title}"/>
                        </h2>
                        <p class="admin-dialog-hero-desc">
                            <h:outputText value="—" rendered="#{empty adminRoleGroupsBean.detailGroup.description}"/>
                            <h:outputText value="#{adminRoleGroupsBean.detailGroup.description}"
                                         rendered="#{not empty adminRoleGroupsBean.detailGroup.description}"/>
                        </p>
                    </div>
                    <div class="admin-dialog-kv">
                        <div class="admin-dialog-kv-label">Bağlı roller</div>
                        <div class="admin-dialog-chip-panel">
                            <ui:repeat value="#{adminRoleGroupsBean.detailGroupRoleNames}" var="rn">
                                <span class="admin-badge me-1 mb-1 d-inline-block"><h:outputText value="#{rn}"/></span>
                            </ui:repeat>
                            <h:panelGroup rendered="#{empty adminRoleGroupsBean.detailGroupRoleNames}">
                                <span class="admin-dialog-empty-hint">Bağlı rol yok.</span>
                            </h:panelGroup>
                        </div>
                    </div>
                    <div class="admin-dialog-detail-footer">
                        <p:commandButton value="Kapat" icon="pi pi-times" type="button" styleClass="ui-button-secondary"
                                         onclick="PF('rgDetailDlg').hide()"/>
                    </div>
                </h:panelGroup>
            </p:dialog>

            <p:dialog id="rgDlg" header="Rol grubu" widgetVar="rgDlg" modal="true" appendTo="@body" dynamic="true"
                      responsive="true" styleClass="admin-dialog admin-rg-dialog admin-dialog-form"
                      style="max-width: min(92vw, 720px); width: 100%;">
                <h:panelGroup rendered="#{adminRoleGroupsBean.editGroup != null}">
                    <div class="row g-3">
                        <div class="col-lg-5">
                            <h3 class="admin-dialog-kv-heading">Grup bilgisi</h3>
                            <div class="admin-dialog-kv">
                                <label class="admin-dialog-kv-label" for="mainForm:rgTitleInp">Başlık</label>
                                <p:inputText id="rgTitleInp" value="#{adminRoleGroupsBean.editGroup.title}" styleClass="form-control w-100 admin-dialog-input"/>
                            </div>
                            <div class="admin-dialog-kv">
                                <label class="admin-dialog-kv-label" for="mainForm:rgDescInp">Açıklama</label>
                                <p:inputTextarea id="rgDescInp" value="#{adminRoleGroupsBean.editGroup.description}" rows="5" styleClass="form-control w-100 admin-dialog-input"/>
                            </div>
                        </div>
                        <div class="col-lg-7">
                            <h3 class="admin-dialog-kv-heading">Roller</h3>
                            <p:inputText value="#{adminRoleGroupsBean.assignableRoleFilter}" placeholder="Rol adı veya kapsam filtrele…"
                                         styleClass="form-control mb-2 admin-dialog-input">
                                <p:ajax event="keyup" delay="250" update="mainForm:rgDlgRolesPanel"/>
                            </p:inputText>
                            <p:outputPanel id="rgDlgRolesPanel" layout="block" styleClass="admin-rg-dialog-roles">
                                <p:selectManyCheckbox id="rolesPick" value="#{adminRoleGroupsBean.selectedRoles}"
                                                      layout="pageDirection" styleClass="admin-rg-role-checkboxes">
                                    <f:selectItems value="#{adminRoleGroupsBean.filteredAssignableRoles}" var="role"
                                                   itemValue="#{role}" itemLabel="#{role.name} (#{role.scope})"/>
                                </p:selectManyCheckbox>
                            </p:outputPanel>
                        </div>
                    </div>
                    <div class="admin-dialog-footer d-flex flex-wrap justify-content-end gap-2 mt-3">
                        <p:commandButton value="Kaydet" icon="pi pi-check" action="#{adminRoleGroupsBean.save}"
                                         update="mainForm" process="@form" styleClass="admin-btn-primary"/>
                        <p:commandButton value="İptal" icon="pi pi-times" type="button" styleClass="ui-button-secondary"
                                         onclick="PF('rgDlg').hide()"/>
                    </div>
                </h:panelGroup>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
