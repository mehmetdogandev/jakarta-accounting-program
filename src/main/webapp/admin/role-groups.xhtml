<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Rol grupları</ui:define>

    <ui:define name="topbar">
        <span class="admin-app-topbar-heading">Rol grupları</span>
    </ui:define>

    <ui:define name="content">
        <h:form id="mainForm">
            <p:messages id="msgs" showDetail="true" closable="true"/>

            <div class="admin-page-card">
                <h1 class="admin-page-title">Rol grupları</h1>
                <p class="admin-page-lead">Grupları başlık veya açıklamaya göre arayın; bağlı roller rozet olarak özetlenir.</p>

                <div class="admin-list-panel">
                    <div class="admin-toolbar">
                        <div class="admin-toolbar-grow admin-search-wrap">
                            <span class="admin-search-icon pi pi-search" aria-hidden="true"/>
                            <p:inputText value="#{adminRoleGroupsBean.groupSearch}"
                                         placeholder="Başlık veya açıklama ara…"
                                         styleClass="w-100">
                                <p:ajax event="keyup" delay="300" update="rgTablePanel"/>
                            </p:inputText>
                        </div>
                        <div class="admin-toolbar-actions">
                            <p:commandButton value="Yeni rol grubu" icon="pi pi-plus" styleClass="admin-btn-primary"
                                             actionListener="#{adminRoleGroupsBean.openNew}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','CREATE')}"
                                             oncomplete="PF('rgDlg').show()"/>
                            <p:commandButton id="rgColToggleBtn" type="button" value="Sütunlar" icon="pi pi-table"
                                             styleClass="admin-btn-outline"/>
                            <p:columnToggler datasource="rgTbl" trigger="rgColToggleBtn"/>
                        </div>
                    </div>

                    <p:outputPanel id="rgTablePanel" layout="block">
                    <p:dataTable id="rgTbl" value="#{adminRoleGroupsBean.filteredGroups}" var="g"
                                 paginator="true" paginatorPosition="bottom" rows="10" emptyMessage="Kayıt yok"
                                 styleClass="admin-table">
                        <p:column headerText="Grup" togglable="true">
                            <div class="admin-rg-title">
                                <h:outputText value="#{g.title}"/>
                            </div>
                            <div class="admin-rg-desc">
                                <h:outputText value="#{g.description}"/>
                            </div>
                        </p:column>
                        <p:column headerText="Roller" togglable="true">
                            <ui:repeat value="#{adminRoleGroupsBean.linkedRolesTopThree(g)}" var="rn">
                                <span class="admin-badge"><h:outputText value="#{rn}"/></span>
                            </ui:repeat>
                            <h:outputText value="+#{adminRoleGroupsBean.linkedRolesExtraCount(g)} daha"
                                          rendered="#{adminRoleGroupsBean.linkedRolesExtraCount(g) gt 0}"
                                          styleClass="admin-more-badge"/>
                            <h:panelGroup rendered="#{adminRoleGroupsBean.linkedRolesExtraCount(g) eq 0 and empty adminRoleGroupsBean.linkedRolesTopThree(g)}">
                                <span class="text-muted small">—</span>
                            </h:panelGroup>
                        </p:column>
                        <p:column headerText="Oluşturulma" style="width:11rem" togglable="true">
                            <h:outputText value="#{adminUi.formatShortDate(g.createdAt)}"/>
                        </p:column>
                        <p:column headerText="İşlemler" style="width:9rem" togglable="false">
                            <p:commandButton icon="pi pi-pencil" title="Düzenle"
                                             styleClass="admin-btn-icon"
                                             actionListener="#{adminRoleGroupsBean.openEdit(g)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','UPDATE')}"
                                             oncomplete="PF('rgDlg').show()"/>
                            <p:commandButton icon="pi pi-trash" title="Sil"
                                             styleClass="admin-btn-icon admin-btn-danger-icon ms-1"
                                             actionListener="#{adminRoleGroupsBean.softDelete(g)}"
                                             update="mainForm"
                                             rendered="#{rbac.can('ROLE_GROUP','DELETE')}">
                                <p:confirm header="Onay" message="Grup soft-delete ile kaldırılsın mı?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                    </p:outputPanel>
                </div>
            </div>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade"/>

            <p:dialog id="rgDlg" header="Rol grubu" widgetVar="rgDlg" modal="true" appendTo="@body" dynamic="true"
                      width="560" styleClass="admin-dialog">
                <h:panelGroup rendered="#{adminRoleGroupsBean.editGroup != null}">
                    <div class="mb-2">
                        <label class="form-label">Başlık</label>
                        <p:inputText value="#{adminRoleGroupsBean.editGroup.title}" styleClass="form-control w-100"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Açıklama</label>
                        <p:inputTextarea value="#{adminRoleGroupsBean.editGroup.description}" rows="3" styleClass="form-control w-100"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roller</label>
                        <p:selectManyCheckbox id="rolesPick" value="#{adminRoleGroupsBean.selectedRoles}" layout="grid" columns="2">
                            <f:selectItems value="#{adminRoleGroupsBean.assignableRoles}" var="role"
                                           itemValue="#{role}" itemLabel="#{role.name} (#{role.scope})"/>
                        </p:selectManyCheckbox>
                    </div>
                    <p:commandButton value="Kaydet" icon="pi pi-check" action="#{adminRoleGroupsBean.save}"
                                     update="mainForm" process="@form"/>
                    <p:commandButton value="İptal" icon="pi pi-times" type="button" styleClass="ui-button-secondary ms-2"
                                     onclick="PF('rgDlg').hide()"/>
                </h:panelGroup>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
